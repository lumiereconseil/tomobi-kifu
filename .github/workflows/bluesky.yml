name: Daily Bluesky post

# Posts one message a day from content/bluesky-posts.json to the Lumière Conseil Bluesky account.
# Needs repository secrets BLUESKY_HANDLE and BLUESKY_APP_PASSWORD; without them it posts nothing.
on:
  schedule:
    - cron: "0 23 * * *" # 08:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show today's post without posting"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/bluesky-post.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
