name: Test donation
# Clicks a test-mode button on /ja/test-donation/, pays with Stripe's test card 4242 and
# checks the thank-you page. Screenshots are kept as the run's artifact.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/test-donation.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
