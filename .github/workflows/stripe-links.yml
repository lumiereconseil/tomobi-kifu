name: Stripe donations

# Creates donation Payment Links for a partner organisation that finished Stripe Connect
# onboarding. Needs the repository secret STRIPE_SECRET_KEY. The links are public URLs; the
# output is the entry to add to lib/payment-links.ts.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "status (check the key), links (create donate links) or test-org (test-mode dummy organisation)"
        required: true
        default: "status"
        type: choice
        options: [status, links, test-org, test-links]
      slug:
        description: "Recipient slug in lib/recipients.ts (links only)"
        required: false
      account:
        description: "Connected account id acct_... (links only)"
        required: false
      fee:
        description: "Fee percent"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SLUG: ${{ inputs.slug }}
          ACCOUNT: ${{ inputs.account }}
          FEE: ${{ inputs.fee }}
          COMMAND: ${{ inputs.command }}
        run: |
          set -o pipefail
          if [ "$COMMAND" = links ]; then
            node scripts/stripe-setup.mjs links "$SLUG" "$ACCOUNT" "$FEE" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$COMMAND" = test-links ]; then
            node scripts/stripe-setup.mjs test-links | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$COMMAND" = test-org ]; then
            node scripts/stripe-setup.mjs test-org | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/stripe-setup.mjs status | tee -a "$GITHUB_STEP_SUMMARY"
          fi
